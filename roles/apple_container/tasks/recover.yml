---
- name: Inspect the pending service recovery marker
  ansible.builtin.stat:
    path: "{{ apple_container_recovery_marker }}"
    follow: false
  register: apple_container_recovery

- name: Preview pending service recovery
  ansible.builtin.debug:
    msg: Would retry pending Apple container service startup.
  changed_when: true
  when: ansible_check_mode and apple_container_recovery.stat.exists

- name: Resume pending service startup
  when: not ansible_check_mode and apple_container_recovery.stat.exists
  block:
    - name: Start the service requested by the interrupted installation
      ansible.builtin.command:
        argv: ["{{ apple_container_executable }}", system, start, --enable-kernel-install]
      changed_when: true

    - name: Clear the completed service recovery request
      ansible.builtin.file:
        path: "{{ apple_container_recovery_marker }}"
        state: absent
