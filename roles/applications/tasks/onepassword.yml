---
- name: Require a supported 1Password Linux architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture in ['x86_64', 'aarch64']

- name: Install the official x86_64 native package
  ansible.builtin.include_tasks: native.yml
  when: ansible_facts.architecture == 'x86_64'

- name: Preview the signed ARM64 archive installation
  ansible.builtin.debug:
    msg: "Would verify and install {{ application.name }} from {{ application.archive_url }} into {{ applications_onepassword_dir }}."
  changed_when: true
  when: ansible_facts.architecture == 'aarch64' and ansible_check_mode

- name: Install the signed ARM64 archive
  when: ansible_facts.architecture == 'aarch64' and not ansible_check_mode
  block:
    - name: Install signature verification prerequisites
      ansible.builtin.package:
        name: gnupg2
        state: present
      become: true

    - name: Create temporary 1Password download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: -1password
      register: application_onepassword_temp

    - name: Create isolated signature verification directory
      ansible.builtin.file:
        path: "{{ application_onepassword_temp.path }}/gnupg"
        state: directory
        mode: '0700'

    - name: Download the archive and signature
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ application_onepassword_temp.path }}/{{ item.file }}"
        mode: '0600'
      loop:
        - {url: "{{ application.archive_url }}", file: archive.tar.gz}
        - {url: "{{ application.archive_url }}.sig", file: archive.tar.gz.sig}
        - {url: "{{ application.signing_key }}", file: signing-key.asc}

    - name: Import the signing key into the isolated keyring
      ansible.builtin.command:
        argv: [gpg, --batch, --homedir, "{{ application_onepassword_temp.path }}/gnupg", --import, "{{ application_onepassword_temp.path }}/signing-key.asc"]
      changed_when: false

    - name: Verify the archive signature
      ansible.builtin.command:
        argv: [gpg, --batch, --homedir, "{{ application_onepassword_temp.path }}/gnupg", --status-fd=1, --verify, "{{ application_onepassword_temp.path }}/archive.tar.gz.sig", "{{ application_onepassword_temp.path }}/archive.tar.gz"]
      register: application_onepassword_signature
      changed_when: false

    - name: Require the published 1Password signing fingerprint
      ansible.builtin.assert:
        that:
          - "'[GNUPG:] VALIDSIG ' in application_onepassword_signature.stdout"
          - application.signing_fingerprint in application_onepassword_signature.stdout

    - name: Extract the verified archive
      ansible.builtin.unarchive:
        src: "{{ application_onepassword_temp.path }}/archive.tar.gz"
        dest: "{{ application_onepassword_temp.path }}"
        remote_src: true

    - name: Find the vendor installation script
      ansible.builtin.find:
        paths: "{{ application_onepassword_temp.path }}"
        patterns: after-install.sh
        recurse: true
      register: application_onepassword_scripts

    - name: Require exactly one vendor installation script
      ansible.builtin.assert:
        that: application_onepassword_scripts.matched == 1

    - name: Copy the application to its system location
      ansible.builtin.copy:
        src: "{{ (application_onepassword_scripts.files | first).path | dirname }}/"
        dest: "{{ applications_onepassword_dir }}/"
        remote_src: true
        mode: preserve
        backup: true
      become: true

    - name: Run the vendor integration script
      ansible.builtin.command:
        argv: ["{{ applications_onepassword_dir }}/after-install.sh"]
      become: true
      changed_when: true

  always:
    - name: Remove temporary 1Password downloads and keyring
      ansible.builtin.file:
        path: "{{ application_onepassword_temp.path }}"
        state: absent
      when: application_onepassword_temp.path is defined
