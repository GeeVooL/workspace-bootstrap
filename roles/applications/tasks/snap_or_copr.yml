---
- name: Require Linux for Snap or COPR installation
  ansible.builtin.assert:
    that: ansible_facts.system == 'Linux'

- name: Discover Snap
  ansible.builtin.shell: command -v snap
  args:
    executable: /bin/sh
  environment:
    PATH: "{{ applications_search_path }}"
  register: application_snap
  changed_when: false
  failed_when: application_snap.rc not in [0, 1, 127]
  check_mode: false

- name: Install through existing Snap
  when: application_snap.rc == 0 and not (applications_snap_setup_pending | default(false))
  block:
    - name: Check whether the Snap is installed
      ansible.builtin.command:
        argv: ["{{ application_snap.stdout }}", list, "{{ application.snap }}"]
      register: application_snap_package
      changed_when: false
      failed_when: application_snap_package.rc not in [0, 1]
      check_mode: false

    - name: Preview Snap installation
      ansible.builtin.debug:
        msg: "{{ application.name }} will be installed with snap install {{ application.snap }} --classic."
      changed_when: true
      when: ansible_check_mode and application_snap_package.rc != 0

    - name: Install missing Snap with classic confinement
      ansible.builtin.command:
        argv: ["{{ application_snap.stdout }}", install, "{{ application.snap }}", --classic]
      become: true
      changed_when: true
      when: not ansible_check_mode and application_snap_package.rc != 0

- name: Use Fedora COPR when Snap is absent
  when: application_snap.rc != 0 and not (applications_snap_setup_pending | default(false))
  block:
    - name: Require Fedora with DNF for the COPR fallback
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Fedora'
          - ansible_facts.pkg_mgr in ['dnf', 'dnf5']
        fail_msg: "Install and configure Snap first, or install {{ application.name }} manually. Automatic COPR fallback supports Fedora with DNF only."

    - name: Check the native package database
      ansible.builtin.command:
        argv: [rpm, -q, "{{ application.package }}"]
      register: application_copr_package
      changed_when: false
      failed_when: application_copr_package.rc not in [0, 1]
      check_mode: false

    - name: Preview Fedora COPR installation
      ansible.builtin.debug:
        msg: "{{ application.name }} will be installed using {{ application.copr.url | replace('{release}', ansible_facts.distribution_major_version | string) }}."
      changed_when: true
      when: ansible_check_mode and application_copr_package.rc != 0

    - name: Install missing native application from COPR
      when: not ansible_check_mode and application_copr_package.rc != 0
      become: true
      block:
        - name: Create the repository configuration directory
          ansible.builtin.file:
            path: "{{ applications_copr_repo_dir }}"
            state: directory

        - name: Inspect existing COPR configuration
          ansible.builtin.stat:
            path: "{{ applications_copr_repo_dir }}/{{ application.copr.filename }}"
            follow: false
          register: application_copr_config

        - name: Enable the selected COPR repository
          ansible.builtin.get_url:
            url: "{{ application.copr.url | replace('{release}', ansible_facts.distribution_major_version | string) }}"
            dest: "{{ applications_copr_repo_dir }}/{{ application.copr.filename }}"
            mode: '0644'
            force: false
          when: not application_copr_config.stat.exists

        - name: Install the missing native package
          ansible.builtin.command:
            argv: ["{{ ansible_facts.pkg_mgr }}", install, '-y', "{{ application.package }}"]
          changed_when: true

- name: Preview installation after pending Snap setup
  ansible.builtin.debug:
    msg: "Would install {{ application.name }} through Snap after the planned Snap setup."
  changed_when: true
  when: ansible_check_mode and (applications_snap_setup_pending | default(false))
