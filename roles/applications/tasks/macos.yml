---
- name: Install Apple container when selected
  ansible.builtin.include_role:
    name: apple_container
  when: category_apps.apple_container | default(false) | bool

- name: Install selected Homebrew applications
  ansible.builtin.include_role:
    name: homebrew
  vars:
    macos_homebrew_formulae: "{{ category_apps.formulae | default([]) }}"
    macos_homebrew_casks: "{{ category_apps.casks | default([]) }}"
  when: (category_apps.casks | default([]) | length > 0) or (category_apps.formulae | default([]) | length > 0)

- name: Install applications after checking for existing installations
  ansible.builtin.include_tasks: application.yml
  loop: "{{ category_apps.apps | default([]) }}"
  loop_control:
    loop_var: application
    label: "{{ application.name }}"
  when:
    - application.architectures is not defined or ansible_facts.architecture in application.architectures
    - application.minimum_macos_version is not defined or ansible_facts.distribution_version is version(application.minimum_macos_version, '>=')

- name: Report applications unsupported on this Mac
  ansible.builtin.debug:
    msg: >-
      {{ application.name }} requires architectures {{ application.architectures | default(['any']) | join(', ') }}
      and macOS {{ application.minimum_macos_version | default('0') }} or later; skipping installation.
  loop: "{{ category_apps.apps | default([]) }}"
  loop_control:
    loop_var: application
    label: "{{ application.name }}"
  when: >-
    (application.architectures is defined and ansible_facts.architecture not in application.architectures) or
    (application.minimum_macos_version is defined and ansible_facts.distribution_version is version(application.minimum_macos_version, '<'))
