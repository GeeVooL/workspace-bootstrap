---
- name: Require Linux for Flatpak
  ansible.builtin.assert:
    that: ansible_facts.system == 'Linux'

- name: Install Flatpak
  ansible.builtin.package:
    name: flatpak
    state: present
  become: true

- name: Read user Flatpak remotes
  ansible.builtin.command:
    argv: [flatpak, remotes, --user, --show-disabled, '--columns=name,options']
  environment:
    HOME: "{{ applications_home }}"
    LC_ALL: C
  register: application_flatpak_remotes
  changed_when: false
  check_mode: false
  when: application_present or not ansible_check_mode

- name: Identify the configured Flathub remote
  ansible.builtin.set_fact:
    application_flatpak_remote: "{{ application_flatpak_remotes.stdout_lines | default([]) | select('match', '^' ~ (application.remote | regex_escape) ~ '(\\s|$)') | list }}"

- name: Preview Flathub enablement
  ansible.builtin.debug:
    msg: "Would enable {{ application.remote }} for the current user."
  changed_when: true
  when:
    - ansible_check_mode
    - application_flatpak_remote | length == 0

- name: Add the Flathub remote for the current user
  ansible.builtin.command:
    argv: [flatpak, remote-add, --user, --if-not-exists, "{{ application.remote }}", "{{ application.remote_url }}"]
  environment:
    HOME: "{{ applications_home }}"
  changed_when: true
  when: not ansible_check_mode and application_flatpak_remote | length == 0

- name: Preserve an existing disabled Flathub remote
  ansible.builtin.debug:
    msg: Preserving the disabled Flathub remote; enable it manually if desired.
  when: "'disabled' in (application_flatpak_remote | join(' '))"
