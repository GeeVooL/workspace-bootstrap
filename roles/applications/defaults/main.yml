---
applications_catalog: {}
applications_enabled_categories: "{{ applications_catalog.keys() | list }}"
applications_excluded_categories: []
applications_setup_categories: []
workplace_only: false
homebrew_search_path: "{{ ansible_facts.env.PATH }}:/opt/homebrew/bin:/usr/local/bin"
applications_home: "{{ ansible_facts.env.HOME }}"
applications_bin_dir: "{{ applications_home }}/.local/bin"
applications_search_path: "{{ ((workstation_resolved_bin_paths | default([])) + workstation_search_directories + [applications_bin_dir] + ansible_facts.env.PATH.split(':') + ['/usr/bin', '/bin']) | unique | join(':') }}"
applications_macos_dirs: ["/Applications", "{{ applications_home }}/Applications"]
applications_macos_install_dir: /Applications
applications_copr_repo_dir: /etc/yum.repos.d
applications_fonts_dir: "{{ applications_home }}/.local/share/fonts"
applications_onepassword_dir: /opt/1Password
applications_xcode_select: /usr/bin/xcode-select
applications_snap_mount_path: /snap
applications_snap_mount_source: /var/lib/snapd/snap
applications_snap_setup_marker: /var/lib/workstation-bootstrap/snapd-installing
applications_desktop_directories: /usr/share/desktop-directories
applications_android_dir: "{{ applications_home }}/.local/share/workstation-bootstrap/android"
applications_android_java_home: "{{ applications_android_dir }}/java"
applications_zed_dir: "{{ applications_home }}/.local/zed.app"
applications_zed_marker: "{{ applications_home }}/.local/.workstation-zed-installing"
