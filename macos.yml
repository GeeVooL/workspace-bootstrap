---
- name: Configure macOS workstation packages and shell paths
  hosts: workstations
  gather_facts: true
  become: false
  pre_tasks:
    - name: Require macOS
      ansible.builtin.assert:
        that: ansible_facts.system == 'Darwin'
      tags: [always]
  roles:
    - role: applications
      tags: [applications]
    - role: shell_paths
      tags: [shell_paths]
