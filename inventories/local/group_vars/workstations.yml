---
# Machine-profile policy; reusable roles keep their defaults in roles/*/defaults.
applications_setup_categories: [package_managers]
applications_catalog:
  package_managers:
    linux:
      apps:
        - name: Snap
          id: snapd
          workplace_permitted: true
          commands: [snap]
          installer: snapd
  utilities:
    macos:
      formulae:
        - {name: mise, workplace_permitted: true}
        - {name: fish, workplace_permitted: true}
        - {name: git, workplace_permitted: true}
        - {name: starship, workplace_permitted: true}
        - {name: fzf, workplace_permitted: true}
        - {name: zoxide, workplace_permitted: true}
        - {name: bat, workplace_permitted: true}
        - {name: fd, workplace_permitted: true}
        - {name: ripgrep, workplace_permitted: true}
        - {name: tree, workplace_permitted: true}
        - {name: jq, workplace_permitted: true}
      casks: []
      apps:
        - name: Ghostty
          workplace_permitted: true
          id: ghostty
          commands: [ghostty]
          bundle: Ghostty.app
          installer: homebrew
          cask: ghostty
    linux:
      packages: []
      apps:
        - name: Ghostty
          workplace_permitted: true
          id: ghostty
          commands: [ghostty]
          paths:
            - /usr/bin/ghostty
            - /usr/local/bin/ghostty
            - /snap/bin/ghostty
            - /var/lib/snapd/snap/bin/ghostty
          installer: snap_or_copr
          snap: ghostty
          package: ghostty
          copr:
            url: https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-{release}/scottames-ghostty-fedora-{release}.repo
            filename: workstation-scottames-ghostty.repo
  development:
    macos:
      apps:
        - name: Fork
          id: fork
          workplace_permitted: false
          commands: []
          bundle: Fork.app
          installer: homebrew
          cask: fork
      formulae: []
      apple_container:
        enabled: true
        workplace_permitted: true
    linux:
      packages: []
  editors:
    macos:
      apps:
        - name: Visual Studio Code
          workplace_permitted: true
          id: vscode
          commands: [code]
          bundle: Visual Studio Code.app
          installer: dmg
          url: https://update.code.visualstudio.com/latest/darwin-universal-dmg/stable
        - name: Zed
          workplace_permitted: true
          id: zed
          commands: [zed]
          bundle: Zed.app
          installer: homebrew
          cask: zed
    linux:
      apps:
        - name: Visual Studio Code
          workplace_permitted: true
          id: vscode
          commands: [code]
          paths:
            - /usr/share/code/bin/code
            - /opt/visual-studio-code/bin/code
            - "{{ applications_home }}/.local/share/flatpak/app/com.visualstudio.code"
            - /var/lib/flatpak/app/com.visualstudio.code
          installer: native
          package: code
          urls:
            deb:
              x86_64: https://update.code.visualstudio.com/latest/linux-deb-x64/stable
              aarch64: https://update.code.visualstudio.com/latest/linux-deb-arm64/stable
            rpm:
              x86_64: https://update.code.visualstudio.com/latest/linux-rpm-x64/stable
              aarch64: https://update.code.visualstudio.com/latest/linux-rpm-arm64/stable
          signing_key: https://packages.microsoft.com/keys/microsoft.asc
        - name: Zed
          workplace_permitted: true
          id: zed
          commands: [zed, zeditor, zedit]
          paths:
            - "{{ applications_home }}/.local/zed.app"
            - "{{ applications_home }}/.local/bin/zed"
            - "{{ applications_home }}/.local/share/applications/dev.zed.Zed.desktop"
            - /opt/zed.app/bin/zed
            - "{{ applications_home }}/.local/share/flatpak/app/dev.zed.Zed"
            - /var/lib/flatpak/app/dev.zed.Zed
          installer: script
          url: https://zed.dev/install.sh

  writing:
    macos:
      apps:
        - name: Typora
          workplace_permitted: false
          id: typora
          commands: [typora]
          bundle: Typora.app
          installer: homebrew
          cask: typora
    linux:
      apps:
        - name: Typora
          workplace_permitted: false
          id: typora
          commands: [typora]
          paths:
            - /usr/share/typora/Typora
            - "{{ applications_home }}/.local/share/flatpak/app/io.typora.Typora"
            - /var/lib/flatpak/app/io.typora.Typora
          installer: native_or_snap
          snap: typora
          package: typora
          urls:
            deb:
              x86_64: https://downloads.typora.io/linux/typora_1.14.9_amd64.deb
              aarch64: https://downloads.typora.io/linux/typora_1.14.9_arm64.deb
  security:
    macos:
      apps:
        - name: Little Snitch
          workplace_permitted: false
          id: little-snitch
          commands: []
          bundle: Little Snitch.app
          installer: homebrew
          cask: little-snitch
        - name: 1Password
          workplace_permitted: false
          id: 1password
          commands: []
          bundle: 1Password.app
          installer: homebrew
          cask: 1password
    linux:
      apps:
        - name: 1Password
          workplace_permitted: false
          id: 1password
          commands: [1password]
          paths: [/usr/bin/1password]
          installer: onepassword
          package: 1password
          urls:
            deb:
              x86_64: https://downloads.1password.com/linux/debian/amd64/stable/1password-latest.deb
            rpm:
              x86_64: https://downloads.1password.com/linux/rpm/stable/x86_64/1password-latest.rpm
          signing_key: https://downloads.1password.com/linux/keys/1password.asc
          signing_fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22
          archive_url: https://downloads.1password.com/linux/tar/stable/aarch64/1password-latest.tar.gz
  fonts:
    macos:
      casks:
        - {name: font-jetbrains-mono, workplace_permitted: true}
        - {name: font-jetbrains-mono-nerd-font, workplace_permitted: true}
    linux:
      apps:
        - name: JetBrains Mono
          id: jetbrains-mono
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_fonts_dir }}/jetbrains-mono/JetBrainsMono-Regular.ttf"]
          installer: font_archive
          url: https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
        - name: JetBrains Mono Nerd Font
          id: jetbrains-mono-nerd-font
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_fonts_dir }}/jetbrains-mono-nerd-font/JetBrainsMonoNerdFont-Regular.ttf"]
          installer: font_archive
          url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
  desktop:
    linux:
      apps:
        - name: Flatpak and Flathub
          id: flatpak
          workplace_permitted: true
          commands: [flatpak]
          installer: flatpak
          remote: flathub
          remote_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  android_development:
    macos:
      formulae:
        - {name: scrcpy, workplace_permitted: true}
        - {name: jadx, workplace_permitted: true}
      casks:
        - {name: android-platform-tools, workplace_permitted: true}
        - {name: android-commandlinetools, workplace_permitted: true}
        - {name: temurin, workplace_permitted: true}
      apps:
        - name: Oh My Android
          id: oh-my-android
          workplace_permitted: false
          commands: []
          bundle: Oh My Android.app
          installer: homebrew
          cask: ateymoori/tap/oh-my-android
          architectures: [arm64]
          minimum_macos_version: '26'
    linux:
      # OS extraction prerequisites only; Android applications come from upstream.
      packages:
        - {name: tar, workplace_permitted: true}
        - {name: unzip, workplace_permitted: true}
        - {name: "{{ 'xz-utils' if ansible_facts.os_family == 'Debian' else 'xz' }}", workplace_permitted: true}
      apps:
        - name: Temurin Java for Android tools
          id: android-java
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_android_java_home }}/bin/java"]
          architectures: [x86_64, aarch64]
          installer: upstream_archive
          destination: "{{ applications_android_java_home }}"
          metadata_kind: adoptium
          metadata_url: "https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture={{ 'x64' if ansible_facts.architecture == 'x86_64' else 'aarch64' }}&image_type=jdk&os=linux&vendor=eclipse"
          archive_format: tar.gz
          archive_root: 'jdk-*'
          executables: [bin/java]
        - name: Android Studio
          id: android-studio
          workplace_permitted: true
          commands: [android-studio]
          paths: ["{{ applications_android_dir }}/studio/bin/studio", /opt/android-studio/bin/studio, /opt/android-studio/bin/studio.sh]
          architectures: [x86_64]
          installer: upstream_archive
          destination: "{{ applications_android_dir }}/studio"
          metadata_kind: google_page
          metadata_url: https://developer.android.com/studio
          asset_pattern: 'android-studio-[a-zA-Z0-9._-]+-linux\.tar\.gz'
          archive_format: tar.gz
          archive_root: android-studio
          executables: [bin/studio]
          launchers:
            - {name: android-studio, path: bin/studio}
        - name: Android Studio for Platform
          id: asfp
          workplace_permitted: true
          commands: [asfp]
          paths: ["{{ applications_android_dir }}/asfp/bin/studio.sh", /opt/android-studio-for-platform/bin/studio.sh]
          architectures: [x86_64]
          installer: upstream_archive
          destination: "{{ applications_android_dir }}/asfp"
          metadata_kind: direct
          metadata_url: https://dl.google.com/android/asfp/asfp-current-linux.deb
          archive_format: deb
          archive_parent: tmp
          archive_root: 'android-studio-for-platform-*'
          executables: [bin/studio, bin/studio.sh]
          launchers:
            - {name: asfp, path: bin/studio}
        - name: Android Platform Tools
          id: android-platform-tools
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_android_dir }}/sdk/platform-tools/adb"]
          architectures: [x86_64]
          installer: upstream_archive
          destination: "{{ applications_android_dir }}/sdk/platform-tools"
          metadata_kind: google_sdk
          metadata_url: https://dl.google.com/android/repository/repository2-3.xml
          asset_pattern: platform-tools
          archive_format: zip
          archive_root: platform-tools
          executables: [adb, fastboot]
          launchers:
            - {name: adb, path: adb}
            - {name: fastboot, path: fastboot}
        - name: Android Command-line Tools
          id: android-commandlinetools
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_android_dir }}/sdk/cmdline-tools/latest/bin/sdkmanager"]
          architectures: [x86_64]
          installer: upstream_archive
          destination: "{{ applications_android_dir }}/sdk/cmdline-tools/latest"
          java_home: "{{ applications_android_java_home }}"
          metadata_kind: google_page
          metadata_url: https://developer.android.com/studio
          asset_pattern: 'commandlinetools-linux-[0-9]+_latest\.zip'
          archive_format: zip
          archive_root: cmdline-tools
          executables: [bin/sdkmanager, bin/avdmanager]
          launchers:
            - {name: sdkmanager, path: bin/sdkmanager}
            - {name: avdmanager, path: bin/avdmanager}
        - name: JADX
          id: jadx
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_android_dir }}/jadx/bin/jadx"]
          architectures: [x86_64, aarch64]
          installer: upstream_archive
          destination: "{{ applications_android_dir }}/jadx"
          java_home: "{{ applications_android_java_home }}"
          metadata_kind: github
          metadata_url: https://api.github.com/repos/skylot/jadx/releases/latest
          asset_pattern: 'jadx-[0-9.]+\.zip'
          archive_format: zip
          archive_root: '.'
          executables: [bin/jadx, bin/jadx-gui]
          launchers:
            - {name: jadx, path: bin/jadx}
            - {name: jadx-gui, path: bin/jadx-gui}
        - name: scrcpy
          id: scrcpy
          workplace_permitted: true
          commands: []
          paths: ["{{ applications_android_dir }}/scrcpy/scrcpy"]
          architectures: [x86_64]
          installer: upstream_archive
          destination: "{{ applications_android_dir }}/scrcpy"
          metadata_kind: github
          metadata_url: https://api.github.com/repos/Genymobile/scrcpy/releases/latest
          asset_pattern: 'scrcpy-linux-x86_64-v[0-9.]+\.tar\.gz'
          archive_format: tar.gz
          archive_root: 'scrcpy-linux-x86_64-*'
          executables: [scrcpy]
          launchers:
            - name: scrcpy
              path: scrcpy
              environment:
                ADB: "{{ applications_android_dir }}/sdk/platform-tools/adb"
  apple_development:
    macos:
      apps:
        - name: Apple Command Line Tools
          id: command-line-tools
          workplace_permitted: false
          commands: []
          installer: command_line_tools
        - name: Xcode
          id: xcode
          workplace_permitted: false
          commands: []
          bundle: Xcode.app
          installer: mas
          app_store_id: '497799835'

applications_excluded_categories: []
