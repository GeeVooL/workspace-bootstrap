---
- name: Make workstation utilities available in Fish, Bash, and Zsh
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    shell_home: "{{ ansible_facts.user_dir }}"
    terminal_config_root: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(shell_home ~ '/.config', true) }}"
    shell_zdotdir: "{{ ansible_facts.env.ZDOTDIR | default(shell_home, true) }}"
    shell_extra_bin_paths: []
    shell_standard_bin_paths: "{{ ['/opt/homebrew/bin', '/usr/local/bin'] if ansible_facts.system == 'Darwin' else ['/home/linuxbrew/.linuxbrew/bin', '/usr/local/bin'] }}"

  pre_tasks:
    - name: Require macOS or Linux and a normal user
      ansible.builtin.assert:
        that:
          - ansible_facts.system in ['Darwin', 'Linux']
          - ansible_facts.user_uid != 0
        fail_msg: Run locally as your normal account on macOS or Linux, without sudo.

    - name: Discover Homebrew for shell PATH setup
      ansible.builtin.shell: command -v brew
      args:
        executable: /bin/sh
      environment:
        PATH: "{{ (shell_extra_bin_paths + [ansible_facts.env.PATH] + shell_standard_bin_paths) | join(':') }}"
      register: shell_brew_lookup
      changed_when: false
      failed_when: shell_brew_lookup.rc not in [0, 1]
      check_mode: false

    - name: Read the Homebrew prefix
      ansible.builtin.command:
        argv: ["{{ macos_homebrew_executable | default(workstation_homebrew_executable | default(shell_brew_lookup.stdout)) }}", --prefix]
      register: shell_brew_prefix
      changed_when: false
      check_mode: false
      # A fresh macOS check run has no brew executable yet.
      when:
        - shell_brew_lookup.rc == 0 or macos_homebrew_executable is defined or workstation_homebrew_executable is defined
        - not (ansible_check_mode and macos_brew_stat is defined and not macos_brew_stat.stat.exists)

    - name: Select persistent executable directories
      ansible.builtin.set_fact:
        workstation_bin_paths: "{{ (shell_extra_bin_paths + [shell_home ~ '/.local/bin'] + ([shell_brew_prefix.stdout ~ '/bin', shell_brew_prefix.stdout ~ '/sbin'] if shell_brew_prefix.stdout is defined else shell_standard_bin_paths)) | unique | list }}"

    - name: Require absolute executable directories without PATH separators
      ansible.builtin.assert:
        that:
          - item.startswith('/')
          - "':' not in item"
          - "'\n' not in item"
      loop: "{{ workstation_bin_paths }}"

    - name: Find the existing Bash login file in Bash precedence order
      ansible.builtin.stat:
        path: "{{ shell_home }}/{{ item }}"
      loop: [.bash_profile, .bash_login, .profile]
      register: shell_bash_profiles

    - name: Select the active Bash login file without shadowing an existing one
      ansible.builtin.set_fact:
        shell_bash_login_path: "{{ (shell_bash_profiles.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default(shell_home ~ '/.profile') }}"

  tasks:
    - name: Create shell configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ terminal_config_root }}/fish/conf.d"
        - "{{ terminal_config_root }}/workstation-bootstrap"

    - name: Ensure shell startup directories exist without changing existing modes
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: "{{ [shell_home, shell_zdotdir] | unique | list }}"

    - name: Install early Fish PATH configuration
      ansible.builtin.template:
        src: templates/shell-paths.fish.j2
        dest: "{{ terminal_config_root }}/fish/conf.d/00-workstation-path.fish"
        mode: '0644'
        backup: true

    - name: Install shared Bash and Zsh PATH configuration
      ansible.builtin.template:
        src: templates/shell-paths.sh.j2
        dest: "{{ terminal_config_root }}/workstation-bootstrap/path.sh"
        mode: '0644'
        backup: true
        validate: /bin/sh -n %s

    - name: Load executable paths in interactive and login shells
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        create: true
        backup: true
        insertbefore: BOF
        marker: '# {mark} WORKSTATION BOOTSTRAP PATH'
        block: "{{ lookup('ansible.builtin.template', 'templates/shell-path-hook.sh.j2') }}"
      loop:
        - "{{ shell_home }}/.bashrc"
        - "{{ shell_bash_login_path }}"
        - "{{ shell_zdotdir }}/.zshrc"
        - "{{ shell_zdotdir }}/.zprofile"
